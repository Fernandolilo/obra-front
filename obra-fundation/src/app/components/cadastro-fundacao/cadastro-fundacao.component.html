<form
  class="fundacao-form"
  [formGroup]="fundacaoForm"
  (ngSubmit)="onSubmit()">

  <!-- =====================================================
       CABEÇALHO
       ===================================================== -->

  <header class="fundacao-form__header">

    <span class="fundacao-form__eyebrow">
      Gestão de obras
    </span>

    <h1 class="fundacao-form__title">
      Cadastro de fundação
    </h1>

    <p class="fundacao-form__description">
      Informe os dados principais da fundação, suas dimensões
      e classificação.
    </p>

  </header>


  <!-- =====================================================
       PERÍODO DA FUNDAÇÃO
       ===================================================== -->

  <fieldset class="fundacao-form__section">

    <legend>
      Período da fundação
    </legend>

    <div class="fundacao-form__grid">

      <div class="fundacao-form__field">

        <label for="inicio">
          Data de início
        </label>

        <input
          id="inicio"
          type="date"
          formControlName="inicio">

      </div>


      <div class="fundacao-form__field">

        <label for="fim">
          Data de término
        </label>

        <input
          id="fim"
          type="date"
          formControlName="fim">

      </div>

    </div>

  </fieldset>


  <!-- =====================================================
       DIMENSÕES
       ===================================================== -->

  <fieldset class="fundacao-form__section">

    <legend>
      Dimensões da fundação
    </legend>

    <p class="fundacao-form__section-description">
      Informe as dimensões utilizadas para o cálculo da cubagem.
    </p>

    <div class="fundacao-form__grid">

      <div class="fundacao-form__field">

        <label for="altura">
          Altura
        </label>

        <input
          id="altura"
          type="number"
          formControlName="altura"
          min="0"
          step="0.01"
          inputmode="decimal">

      </div>


      <div class="fundacao-form__field">

        <label for="largura">
          Largura
        </label>

        <input
          id="largura"
          type="number"
          formControlName="largura"
          min="0"
          step="0.01"
          inputmode="decimal">

      </div>


      <div class="fundacao-form__field">

        <label for="comprimento">
          Comprimento
        </label>

        <input
          id="comprimento"
          type="number"
          formControlName="comprimento"
          min="0"
          step="0.01"
          inputmode="decimal">

      </div>

    </div>

  </fieldset>


  <!-- =====================================================
       CLASSIFICAÇÃO DA FUNDAÇÃO
       ===================================================== -->

  <fieldset
    class="fundacao-form__section"
    formGroupName="modalFundacaoId">

    <legend>
      Classificação da fundação
    </legend>

    <div class="fundacao-form__grid">

      <div class="fundacao-form__field">

        <label for="fundacao">
          Tipo de fundação
        </label>

        <select
          id="fundacao"
          formControlName="fundacao">

          <option value="">
            Selecione
          </option>

          @for (tipo of tiposFundacao; track tipo) {

            <option [value]="tipo">
              {{ tipo }}
            </option>

          }

        </select>

      </div>


      <div class="fundacao-form__field">

        <label for="estaca">
          Tipo de estaca
        </label>

        <select
          id="estaca"
          formControlName="estaca">

          <option value="">
            Selecione
          </option>

          @for (tipo of tiposEstaca; track tipo) {

            <option [value]="tipo">
              {{ tipo }}
            </option>

          }

        </select>

      </div> 

      <!-- ================================================= ETAPA ================================================= --> 
       <div class="fundacao-form__field"> 
        <label for="etapa"> Etapa da fundação </label> 
          <select id="etapa" formControlName="etapa"> 
            <option value=""> Selecione </option>
             @for (etapa of etapasFundacao; track etapa)
              { <option [value]="etapa"> {{ etapa }}
                 </option> } 
        </select> 
      </div>


      <div class="fundacao-form__field">

        <label for="sapata">
          Tipo de sapata
        </label>

        <select
          id="sapata"
          formControlName="sapata">

          <option value="">
            Selecione
          </option>

          @for (tipo of tiposSapata; track tipo) {

            <option [value]="tipo">
              {{ tipo }}
            </option>

          }

        </select>

      </div>

    </div>

  </fieldset>


  <!-- =====================================================
       AÇÕES
       ===================================================== -->

  <footer class="fundacao-form__actions">

    <button
      type="submit"
      class="fundacao-form__submit">

      Cadastrar fundação

    </button>

  </footer>

</form>
